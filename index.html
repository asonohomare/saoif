<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素材ドロップ検索データベース</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            blue: '#eef6ff',
                            blueBorder: '#bfdbfe',
                            blueText: '#1e40af',
                            mint: '#f0fdf4',
                            mintBorder: '#bbf7d0',
                            mintText: '#166534',
                            purple: '#faf5ff',
                            purpleBorder: '#e9d5ff',
                            purpleText: '#6b21a8',
                            grayBg: '#fafafa',
                            cardBorder: '#f1f5f9'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #ffffff;
            color: #334155;
            font-family: 'Noto Sans JP', sans-serif;
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f8fafc;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-white">

    <!-- ヘッダー -->
    <header class="border-b border-slate-100 pt-2.5 pb-2.5 px-3 md:px-6 bg-white sticky top-0 z-20 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-blue-50 border border-blue-200 text-blue-600 flex items-center justify-center font-bold text-lg shadow-sm">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-800 leading-tight">素材ドロップ検索 DB <span class="text-xs font-normal text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-200 ml-1">441件対応</span></h1>
                    <p class="text-[11px] text-slate-400">章・階層・エネミー対応ドロップデータベース</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- データ一括編集ボタン -->
                <button id="openImportBtn" class="flex items-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 transition">
                    <i class="fa-solid fa-file-import text-blue-500"></i>
                    <span>データ編集 / インポート</span>
                </button>

                <!-- ヒット件数バッジ -->
                <div class="flex items-center space-x-1.5 bg-slate-50 border border-slate-200 px-3 py-1 rounded-full text-xs">
                    <span class="text-slate-500">検索結果:</span>
                    <span id="resultCount" class="font-bold text-blue-600 text-sm">0</span>
                    <span class="text-slate-400">/ <span id="totalCount">0</span> 件</span>
                </div>
            </div>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-3 md:px-6 py-3">
        
        <!-- 検索パネル -->
        <section class="bg-slate-50/70 border border-slate-200/80 rounded-xl p-3 sm:p-4 mb-4 shadow-sm">
            <div class="flex items-center justify-between mb-2.5">
                <h2 class="text-xs font-semibold text-slate-500 tracking-wider uppercase flex items-center gap-1.5">
                    <i class="fa-solid fa-filter text-blue-400"></i> 条件で検索
                </h2>
                <button id="clearBtn" class="text-xs text-slate-400 hover:text-slate-600 transition flex items-center gap-1 px-2 py-0.5 rounded hover:bg-slate-200/50">
                    <i class="fa-solid fa-rotate-left text-[10px]"></i> 条件リセット
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5 sm:gap-3">
                <!-- 1. 素材名検索 -->
                <div class="relative">
                    <label for="materialSearch" class="block text-xs font-medium text-slate-600 mb-1">
                        <i class="fa-solid fa-cube text-blue-500/70 mr-1"></i>素材名
                    </label>
                    <div class="relative">
                        <input type="text" id="materialSearch" placeholder="例: ささ身, ひき肉, 骨..." 
                            class="w-full pl-8 pr-8 py-1.5 text-xs sm:text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-400 transition placeholder:text-slate-300">
                        <i class="fa-solid fa-cube absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
                        <button class="clear-single absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 hidden" data-target="materialSearch">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- 2. 階層検索 -->
                <div class="relative">
                    <label for="floorSearch" class="block text-xs font-medium text-slate-600 mb-1">
                        <i class="fa-solid fa-layer-group text-emerald-500/70 mr-1"></i>階層
                    </label>
                    <div class="relative">
                        <input type="text" id="floorSearch" placeholder="例: 1層, 16層, 25層..." 
                            class="w-full pl-8 pr-8 py-1.5 text-xs sm:text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-300 focus:border-emerald-400 transition placeholder:text-slate-300">
                        <i class="fa-solid fa-layer-group absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
                        <button class="clear-single absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 hidden" data-target="floorSearch">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- 3. エネミー検索 -->
                <div class="relative">
                    <label for="enemySearch" class="block text-xs font-medium text-slate-600 mb-1">
                        <i class="fa-solid fa-ghost text-purple-500/70 mr-1"></i>エネミー
                    </label>
                    <div class="relative">
                        <input type="text" id="enemySearch" placeholder="例: ボス, オーク, カニ..." 
                            class="w-full pl-8 pr-8 py-1.5 text-xs sm:text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-300 focus:border-purple-400 transition placeholder:text-slate-300">
                        <i class="fa-solid fa-ghost absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-300 text-xs"></i>
                        <button class="clear-single absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-300 hover:text-slate-500 hidden" data-target="enemySearch">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- クイックキーワードタグ -->
            <div class="mt-3 pt-2.5 border-t border-slate-200/60 flex flex-wrap items-center gap-1.5 text-[11px] text-slate-400">
                <span class="mr-1"><i class="fa-solid fa-bolt text-amber-400"></i> クイック:</span>
                <button class="tag-btn bg-white hover:bg-blue-50 border border-slate-200 text-slate-600 px-2 py-0.5 rounded transition" data-type="material" data-val="ひき肉">ひき肉</button>
                <button class="tag-btn bg-white hover:bg-blue-50 border border-slate-200 text-slate-600 px-2 py-0.5 rounded transition" data-type="material" data-val="白身のサク">白身のサク</button>
                <button class="tag-btn bg-white hover:bg-blue-50 border border-slate-200 text-slate-600 px-2 py-0.5 rounded transition" data-type="material" data-val="熟成肉">熟成肉</button>
                <button class="tag-btn bg-white hover:bg-emerald-50 border border-slate-200 text-slate-600 px-2 py-0.5 rounded transition" data-type="floor" data-val="1層">1層</button>
                <button class="tag-btn bg-white hover:bg-emerald-50 border border-slate-200 text-slate-600 px-2 py-0.5 rounded transition" data-type="floor" data-val="16層">16層</button>
                <button class="tag-btn bg-white hover:bg-emerald-50 border border-slate-200 text-slate-600 px-2 py-0.5 rounded transition" data-type="floor" data-val="25層">25層</button>
                <button class="tag-btn bg-white hover:bg-purple-50 border border-slate-200 text-slate-600 px-2 py-0.5 rounded transition" data-type="enemy" data-val="ボス">ボス</button>
            </div>
        </section>

        <!-- 表示コントロールバー -->
        <div class="flex items-center justify-between mb-3 px-1 text-xs text-slate-500">
            <div class="flex items-center space-x-2">
                <span class="text-slate-400">表示形式:</span>
                <button id="viewTableBtn" class="px-2.5 py-1 rounded-md bg-white border border-slate-300 text-slate-700 font-medium shadow-sm flex items-center gap-1 active">
                    <i class="fa-solid fa-table-cells"></i> 表表示
                </button>
                <button id="viewCardBtn" class="px-2.5 py-1 rounded-md bg-slate-100 hover:bg-white border border-transparent hover:border-slate-300 text-slate-500 flex items-center gap-1 transition">
                    <i class="fa-solid fa-border-all"></i> カード表示
                </button>
            </div>
            
            <div class="flex items-center space-x-1.5">
                <label for="sortSelect" class="text-slate-400 hidden sm:inline">並び替え:</label>
                <select id="sortSelect" class="bg-white border border-slate-200 text-slate-600 text-xs rounded-lg px-2 py-1 focus:outline-none focus:ring-1 focus:ring-blue-300">
                    <option value="default">初期順</option>
                    <option value="material">素材名 (昇順)</option>
                    <option value="floorAsc">階層 (低→高)</option>
                    <option value="floorDesc">階層 (高→低)</option>
                    <option value="enemy">エネミー名</option>
                </select>
            </div>
        </div>

        <!-- 1. テーブルビュー -->
        <div id="tableView" class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs sm:text-sm">
                    <thead>
                        <tr class="bg-slate-50/90 border-b border-slate-200 text-slate-600 font-medium">
                            <th class="py-2.5 px-3 min-w-[120px] sm:min-w-[140px] text-blue-700 bg-blue-50/40">素材名</th>
                            <th class="py-2.5 px-2.5 min-w-[65px] text-center">章</th>
                            <th class="py-2.5 px-2.5 min-w-[75px] text-center text-emerald-700 bg-emerald-50/30">階層</th>
                            <th class="py-2.5 px-2 text-center min-w-[45px]">1</th>
                            <th class="py-2.5 px-2 text-center min-w-[45px]">2</th>
                            <th class="py-2.5 px-3 min-w-[95px]">ダンジョン</th>
                            <th class="py-2.5 px-3 min-w-[110px] text-purple-700 bg-purple-50/30">エネミー</th>
                            <th class="py-2.5 px-3 min-w-[140px]">備考</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <!-- JSで動的に注入 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2. カードビュー -->
        <div id="cardView" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <!-- JSで動的に注入 -->
        </div>

        <!-- データ未ヒット時のメッセージ -->
        <div id="noResults" class="hidden bg-slate-50 border border-dashed border-slate-200 rounded-xl p-8 text-center my-4">
            <i class="fa-solid fa-magnifying-glass text-3xl text-slate-300 mb-2"></i>
            <p class="text-sm font-medium text-slate-600">一致するデータが見つかりませんでした</p>
            <p class="text-xs text-slate-400 mt-1">検索キーワードを変更するか、平仮名・片仮名を確認してください</p>
            <button id="resetNoResultsBtn" class="mt-3 px-3 py-1.5 text-xs bg-white border border-slate-300 hover:bg-slate-50 rounded-lg text-slate-600 font-medium transition shadow-sm">
                すべての条件を解除
            </button>
        </div>

    </main>

    <!-- データインポート/編集モーダル -->
    <div id="importModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-3xl w-full p-5 shadow-2xl border border-slate-100 flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-database text-blue-600 text-lg"></i>
                    <div>
                        <h3 class="font-bold text-slate-800 text-base">データ一括編集 / TSVインポート</h3>
                        <p class="text-xs text-slate-400">タブ区切りまたはカンマ区切りでデータを全件更新・追加できます</p>
                    </div>
                </div>
                <button id="closeImportBtn" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <p class="text-xs text-slate-500 mb-2">
                フォーマット（1行1件、タブ区切り）:<br>
                <code class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-700">素材名	章	階層	枠1	枠2	ダンジョン	エネミー	備考</code>
            </p>

            <textarea id="tsvTextArea" class="w-full h-64 p-3 font-mono text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none mb-3" placeholder="ここにTSVデータを貼り付けてください..."></textarea>

            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                <button id="resetToDefaultBtn" class="text-xs text-rose-500 hover:text-rose-700 font-medium flex items-center gap-1">
                    <i class="fa-solid fa-rotate-left"></i> 初期441件に戻す
                </button>
                <div class="flex items-center gap-2">
                    <button id="cancelImportBtn" class="px-4 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg font-medium transition">キャンセル</button>
                    <button id="applyImportBtn" class="px-4 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition shadow-sm">データを更新</button>
                </div>
            </div>
        </div>
    </div>

        function filterAndRender() {
            const materialQuery = normalizeKana(materialInput.value.trim());
            const floorQuery = normalizeKana(floorInput.value.trim());
            const enemyQuery = normalizeKana(enemyInput.value.trim());

            updateClearButtons();

            let filtered = items.filter(item => {
                if (materialQuery && !normalizeKana(item.material).includes(materialQuery)) return false;
                if (floorQuery && !normalizeKana(item.floor).includes(floorQuery)) return false;
                if (enemyQuery && !normalizeKana(item.enemy).includes(enemyQuery)) return false;
                return true;
            });

            const sortVal = sortSelect.value;
            if (sortVal === 'material') {
                filtered.sort((a, b) => a.material.localeCompare(b.material, 'ja'));
            } else if (sortVal === 'floorAsc') {
                filtered.sort((a, b) => parseFloorNumber(a.floor) - parseFloorNumber(b.floor));
            } else if (sortVal === 'floorDesc') {
                filtered.sort((a, b) => parseFloorNumber(b.floor) - parseFloorNumber(a.floor));
            } else if (sortVal === 'enemy') {
                filtered.sort((a, b) => a.enemy.localeCompare(b.enemy, 'ja'));
            }

            resultCountEl.textContent = filtered.length;

            if (filtered.length === 0) {
                tableView.classList.add('hidden');
                cardView.classList.add('hidden');
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                if (viewMode === 'table') {
                    tableView.classList.remove('hidden');
                    cardView.classList.add('hidden');
                } else {
                    tableView.classList.add('hidden');
                    cardView.classList.remove('hidden');
                }
                renderTable(filtered);
                renderCards(filtered);
            }
        }

        function renderTable(dataList) {
            let html = '';
            dataList.forEach(item => {
                const isBoss = item.enemy.includes('ボス');
                const isShop = item.enemy.includes('武具店');
                
                let enemyBadgeClass = 'bg-slate-100 text-slate-700';
                if (isBoss) enemyBadgeClass = 'bg-rose-50 border border-rose-200 text-rose-700 font-bold';
                else if (isShop) enemyBadgeClass = 'bg-amber-50 border border-amber-200 text-amber-800 font-bold';
                else if (item.dungeon === 'ダンジョン') enemyBadgeClass = 'bg-purple-50 text-purple-700 border border-purple-100';

                html += `
                    <tr class="hover:bg-blue-50/30 transition text-slate-700">
                        <td class="py-2 px-3 font-semibold text-slate-800 bg-blue-50/20">${escapeHtml(item.material)}</td>
                        <td class="py-2 px-2.5 text-center text-slate-500">${escapeHtml(item.chapter)}</td>
                        <td class="py-2 px-2.5 text-center font-medium text-emerald-700 bg-emerald-50/20">${escapeHtml(item.floor)}</td>
                        <td class="py-2 px-2 text-center ${item.col1 === '1' ? 'font-bold text-blue-600 bg-blue-50/10' : 'text-slate-300'}">${escapeHtml(item.col1)}</td>
                        <td class="py-2 px-2 text-center ${item.col2 === '2' ? 'font-bold text-indigo-600 bg-indigo-50/10' : 'text-slate-300'}">${escapeHtml(item.col2)}</td>
                        <td class="py-2 px-3 text-slate-600">
                            ${item.dungeon !== '-' ? `<span class="inline-block px-1.5 py-0.5 text-[11px] rounded bg-slate-100 text-slate-600 border border-slate-200">${escapeHtml(item.dungeon)}</span>` : '<span class="text-slate-300">-</span>'}
                        </td>
                        <td class="py-2 px-3">
                            <span class="inline-block px-2 py-0.5 text-[11px] rounded-md ${enemyBadgeClass}">
                                ${escapeHtml(item.enemy)}
                            </span>
                        </td>
                        <td class="py-2 px-3 text-slate-500 text-[11px]">${escapeHtml(item.remarks)}</td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
        }

        function renderCards(dataList) {
            const groupedMap = new Map();
            dataList.forEach(item => {
                if (!groupedMap.has(item.material)) {
                    groupedMap.set(item.material, []);
                }
                groupedMap.get(item.material).push(item);
            });

            let html = '';
            groupedMap.forEach((itemList, materialName) => {
                html += `
                    <div class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-xs hover:shadow-md transition flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-100">
                                <h3 class="text-sm sm:text-base font-bold text-slate-800 flex items-center gap-1.5">
                                    <i class="fa-solid fa-cube text-blue-500 text-xs"></i>
                                    ${escapeHtml(materialName)}
                                </h3>
                                <span class="text-[10px] font-semibold px-2 py-0.5 bg-blue-50 text-blue-600 rounded-full border border-blue-100">
                                    ${itemList.length}箇所
                                </span>
                            </div>

                            <div class="grid grid-cols-12 gap-1 px-2 py-1 text-[10px] font-bold text-slate-400 bg-slate-100/80 rounded-t-lg border-b border-slate-200/60 mb-1">
                                <div class="col-span-3">階層</div>
                                <div class="col-span-2 text-center">枠</div>
                                <div class="col-span-2">場所</div>
                                <div class="col-span-3">エネミー</div>
                                <div class="col-span-2 text-right">備考</div>
                            </div>

                            <div class="space-y-1">
                                ${itemList.map(item => {
                                    const isBoss = item.enemy.includes('ボス');
                                    const isShop = item.enemy.includes('武具店');
                                    let enemyBadge = 'text-slate-700 font-medium';
                                    if (isBoss) enemyBadge = 'text-rose-700 font-bold bg-rose-50 px-1 py-0.5 rounded border border-rose-200';
                                    else if (isShop) enemyBadge = 'text-amber-800 font-bold bg-amber-50 px-1 py-0.5 rounded border border-amber-200';

                                    const chapterText = (item.chapter !== '全章' && item.chapter !== '-') ? `${escapeHtml(item.chapter)} ` : '';

                                    return `
                                        <div class="grid grid-cols-12 gap-1 items-center px-2 py-1.5 text-xs rounded-md bg-slate-50/70 hover:bg-blue-50/30 transition border border-slate-100">
                                            <div class="col-span-3 font-bold text-emerald-700 text-[11px] truncate">
                                                ${chapterText}${escapeHtml(item.floor)}
                                            </div>
                                            <div class="col-span-2 flex items-center justify-center gap-0.5">
                                                <span class="px-1 py-0.1 rounded text-[10px] font-bold ${item.col1 === '1' ? 'bg-blue-100 text-blue-700' : 'text-slate-300 bg-slate-100/60'}">1</span>
                                                <span class="px-1 py-0.1 rounded text-[10px] font-bold ${item.col2 === '2' ? 'bg-indigo-100 text-indigo-700' : 'text-slate-300 bg-slate-100/60'}">2</span>
                                            </div>
                                            <div class="col-span-2 text-slate-500 text-[11px] truncate">
                                                ${item.dungeon !== '-' ? escapeHtml(item.dungeon) : '<span class="text-slate-300">-</span>'}
                                            </div>
                                            <div class="col-span-3 ${enemyBadge} text-[11px] truncate" title="${escapeHtml(item.enemy)}">
                                                ${escapeHtml(item.enemy)}
                                            </div>
                                            <div class="col-span-2 text-right text-amber-600 font-medium text-[10px] truncate" title="${escapeHtml(item.remarks)}">
                                                ${escapeHtml(item.remarks) || '<span class="text-slate-300">-</span>'}
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });
            cardView.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // インポートモーダルの制御
        openImportBtn.addEventListener('click', () => {
            const currentTsv = items.map(i => `${i.material}\t${i.chapter}\t${i.floor}\t${i.col1}\t${i.col2}\t${i.dungeon}\t${i.enemy}\t${i.remarks}`).join('\n');
            tsvTextArea.value = currentTsv;
            importModal.classList.remove('hidden');
        });

        const closeModal = () => importModal.classList.add('hidden');
        closeImportBtn.addEventListener('click', closeModal);
        cancelImportBtn.addEventListener('click', closeModal);

        applyImportBtn.addEventListener('click', () => {
            const lines = tsvTextArea.value.trim().split('\n');
            const newRawData = [];
            lines.forEach(line => {
                if (!line.trim()) return;
                const cols = line.split('\t').length > 1 ? line.split('\t') : line.split(',');
                newRawData.push([
                    cols[0]?.trim() || '',
                    cols[1]?.trim() || '',
                    cols[2]?.trim() || '',
                    cols[3]?.trim() || '-',
                    cols[4]?.trim() || '-',
                    cols[5]?.trim() || '-',
                    cols[6]?.trim() || '',
                    cols[7]?.trim() || ''
                ]);
            });
            if (newRawData.length > 0) {
                loadItemsFromRaw(newRawData);
                filterAndRender();
                closeModal();
            }
        });

        resetToDefaultBtn.addEventListener('click', () => {
            loadItemsFromRaw(fullRawData);
            tsvTextArea.value = items.map(i => `${i.material}\t${i.chapter}\t${i.floor}\t${i.col1}\t${i.col2}\t${i.dungeon}\t${i.enemy}\t${i.remarks}`).join('\n');
            filterAndRender();
        });

        // イベントリスナー
        [materialInput, floorInput, enemyInput].forEach(input => {
            input.addEventListener('input', filterAndRender);
        });

        sortSelect.addEventListener('change', filterAndRender);

        function resetAllFilters() {
            materialInput.value = '';
            floorInput.value = '';
            enemyInput.value = '';
            sortSelect.value = 'default';
            filterAndRender();
        }

        clearBtn.addEventListener('click', resetAllFilters);
        resetNoResultsBtn.addEventListener('click', resetAllFilters);

        document.addEventListener('click', function(e) {
            const clearSingleBtn = e.target.closest('.clear-single');
            if (clearSingleBtn) {
                const targetId = clearSingleBtn.getAttribute('data-target');
                const targetInput = document.getElementById(targetId);
                if (targetInput) {
                    targetInput.value = '';
                    filterAndRender();
                }
            }

            const tagBtn = e.target.closest('.tag-btn');
            if (tagBtn) {
                const type = tagBtn.getAttribute('data-type');
                const val = tagBtn.getAttribute('data-val');
                if (type === 'material') materialInput.value = val;
                if (type === 'floor') floorInput.value = val;
                if (type === 'enemy') enemyInput.value = val;
                filterAndRender();
            }
        });

        let viewMode = 'table';
        viewTableBtn.addEventListener('click', () => {
            viewMode = 'table';
            viewTableBtn.classList.add('bg-white', 'border-slate-300', 'text-slate-700', 'shadow-sm');
            viewTableBtn.classList.remove('bg-slate-100', 'border-transparent', 'text-slate-500');
            viewCardBtn.classList.remove('bg-white', 'border-slate-300', 'text-slate-700', 'shadow-sm');
            viewCardBtn.classList.add('bg-slate-100', 'border-transparent', 'text-slate-500');
            filterAndRender();
        });

        viewCardBtn.addEventListener('click', () => {
            viewMode = 'card';
            viewCardBtn.classList.add('bg-white', 'border-slate-300', 'text-slate-700', 'shadow-sm');
            viewCardBtn.classList.remove('bg-slate-100', 'border-transparent', 'text-slate-500');
            viewTableBtn.classList.remove('bg-white', 'border-slate-300', 'text-slate-700', 'shadow-sm');
            viewTableBtn.classList.add('bg-slate-100', 'border-transparent', 'text-slate-500');
            filterAndRender();
        });

        loadItemsFromRaw(fullRawData);
        filterAndRender();
    </script>
</body>
</html>
